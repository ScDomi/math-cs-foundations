[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "math-cs-foundations"
version = "0.1.0"
description = "Curated math and computer-science foundations: primes, search, Sudoku, game AI and turmites."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[project.scripts]
foundations = "foundations.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
